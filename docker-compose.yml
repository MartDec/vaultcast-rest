volumes:
  postgresql_vaultcast:

services:
  db:
    image: postgres:18.4
    container_name: vaultcast.postgresql
    environment:
      POSTGRES_PASSWORD: ${DB_PASSWORD}
      POSTGRES_USER: ${DB_USER}
      POSTGRES_DB: ${DB_NAME}
    ports:
      - "127.0.0.1:5431:5432"
    volumes:
      - postgresql_vaultcast:/var/lib/postgresql
